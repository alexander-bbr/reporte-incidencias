<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/fonts.css" />
    <link rel="stylesheet" href="../../assets/css/formulario.css" />
    <link
      rel="shortcut icon"
      href="/reporte-incidencias/public/favicon.ico"
      type="image/x-icon"
    />
    <title>Formulario Usuario</title>
  </head>
  <body>
    <!-- Barra de navegación -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <h1>Reporte de Incidencias</h1>
        </div>
        <ul class="nav-menu">
          <li><a href="../../../index.html">Inicio</a></li>
          <li><a href="../reportes/index.html">Reportes</a></li>
          <li><a href="../equipos/index.html">Equipos</a></li>
          <li><a href="../fallas/index.html">Fallas</a></li>
          <li><a href="../observaciones/index.html">Observaciones</a></li>
          <li><a href="index.html" class="active">Usuarios</a></li>
          <li><a href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
        </ul>
        <div class="user-info" id="userInfo">
          <span id="nombreUsuario">Cargando...</span>
          <span class="badge" id="rolUsuario">ROL</span>
        </div>
      </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
      

      <form class="form" id="usuarioForm" onsubmit="return guardarUsuario(event);">
        <header class="form-header">
          <h2 id="formTitle">Agregar Usuario</h2>
        <header/>

        <input type="hidden" id="modo" value="crear" />
          <input type="hidden" id="cedulaOriginal" value="" />

          <!-- Cédula -->
          <div class="form-group">
            <label for="cedula">Cédula<span class="require-symbol">*</label>
            <input type="text" id="cedula" required autofocus />
          </div>

          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombres<span class="require-symbol">*</label>
            <input type="text" id="nombre" required />
          </div>

          <!-- Apellido -->
          <div class="form-group">
            <label for="apellido">Apellidos<span class="require-symbol">*</label>
            <input type="text" id="apellido" required />
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label for="telefono">Teléfono<span class="require-symbol">*</label>
            <input type="text" id="telefono" required />
          </div>

          <!-- Rol -->
          <div class="form-group">
            <label for="rol">Rol<span class="require-symbol">*</label>
            <select id="rol" required>
              <option value="">...</option>
              <option value="SISTEMAS">Sistemas</option>
              <option value="COORDINADORA">Coordinadora</option>
              <option value="ADMISIONISTA">Admisionista</option>
            </select>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="contrasena">Contraseña<span class="require-symbol">*</label>
            <input type="password" id="contrasena" reaquired />
            <small class="form-text" id="passHelp">
              Mínimo 6 caracteres.
            </small>
          </div>

          <!-- Botones -->
          <div class="buttons-wrapper">
            <button type="submit" class="save-button" id="btnGuardar">
              Guardar
            </button>

            <a href="index.html" class="cancel-button">Cancelar</a>
          </div>

          <div id="mensaje" class="message" style="display: none"></div>
      </form>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/modulos/usuarios.js"></script>
  </body>
</html>
