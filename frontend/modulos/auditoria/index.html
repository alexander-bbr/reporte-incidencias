<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../assets/css/global.css" />
    <link rel="stylesheet" href="../../assets/css/fonts.css" />
    <link rel="stylesheet" href="../../assets/css/modulo.css" />
    <link
      rel="shortcut icon"
      href="/reporte-incidencias/public/favicon.ico"
      type="image/x-icon"
    />
    <title>Auditoría</title>
  </head>
  <body>
    <!-- Barra de navegación -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-brand">
          <h1>Reporte de Incidencias</h1>
        </div>

        <ul class="nav-menu">
          <li><a href="../../../index.html">Inicio</a></li>
          <li><a href="../reportes/index.html">Reportes</a></li>
          <li><a href="../equipos/index.html">Equipos</a></li>
          <li><a href="../fallas/index.html">Fallas</a></li>
          <li><a href="../observaciones/index.html">Observaciones</a></li>
          <li><a href="../usuarios/index.html">Usuarios</a></li>
          <li><a href="index.html" class="active">Auditoría</a></li>
          <li><a href="#" onclick="cerrarSesion()">Cerrar Sesión</a></li>
        </ul>

        <div class="user-info" id="userInfo">
          <span id="nombreUsuario">Cargando...</span>
          <span class="badge" id="rolUsuario">ROL</span>
        </div>
      </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container">
      <div class="page-header">
        <h2>Registro de Auditoría</h2>
      </div>

      <!-- Filtros -->
      <div class="filtros-auditoria">
        <div class="filtro-item">
          <label for="filtroTabla">Tabla:</label>
          <select id="filtroTabla" onchange="aplicarFiltros()">
            <option value="">Todas</option>
            <option value="usuario">Usuario</option>
            <option value="reporte">Reporte</option>
            <option value="equipo">Equipo</option>
            <option value="falla">Falla</option>
            <option value="observacion">Observación</option>
          </select>
        </div>

        <div class="filtro-item">
          <label for="filtroAccion">Acción:</label>
          <select id="filtroAccion" onchange="aplicarFiltros()">
            <option value="">Todas</option>
            <option value="CREAR">Crear</option>
            <option value="EDITAR">Editar</option>
            <option value="ELIMINAR">Eliminar</option>
          </select>
        </div>

        <button onclick="limpiarFiltros()" class="add-register">
          Limpiar filtros
        </button>
      </div>

      <!-- Tabla de auditoría -->
      <div class="table-responsive">
        <table class="table" id="tablaAuditoria">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Usuario</th>
              <th>Acción</th>
              <th>Tabla</th>
              <th>Descripción</th>
              <th>Detalle</th>
            </tr>
          </thead>
          <tbody id="tbodyAuditoria">
            <tr>
              <td colspan="7" class="text-center">Cargando auditoría...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Modal para ver detalle -->
    <div id="modalDetalle" class="modal" style="display: none">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Detalle del movimiento</h3>
          <button onclick="cerrarModal()" class="modal-close">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/permisos.js"></script>
    <script src="../../assets/js/modulos/auditoria.js"></script>
  </body>
</html>
